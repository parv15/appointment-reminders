<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="toast" role="alert" hidden></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
      </span>
      <div>
        <h1><span id="business">Appointments</span> <span class="admin-tag">Admin</span></h1>
        <p id="tagline">Bookings, alerts and replies</p>
      </div>
    </div>
    <div class="top-actions">
      <a class="ghost" href="/" target="_blank" rel="noopener">Open booking portal</a>
      <span id="mode" class="mode" hidden></span>
    </div>
  </header>

  <div class="shell" id="shell">
    <main>
      <section class="stats" aria-label="Summary">
        <div class="stat"><span id="stat-upcoming">0</span><label>Upcoming</label></div>
        <div class="stat good"><span id="stat-confirmed">0</span><label>Confirmed</label></div>
        <div class="stat warn"><span id="stat-reschedule">0</span><label>Need a new time</label></div>
        <div class="stat muted"><span id="stat-cancelled">0</span><label>Cancelled</label></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Bookings</h2>
          <div class="tabs" id="tabs" role="tablist">
            <button type="button" class="on" data-filter="all">All</button>
            <button type="button" data-filter="scheduled">Upcoming</button>
            <button type="button" data-filter="confirmed">Confirmed</button>
            <button type="button" data-filter="reschedule_requested">New time</button>
            <button type="button" data-filter="cancelled">Cancelled</button>
          </div>
        </div>
        <ul id="list" class="list"></ul>
        <div id="empty" class="empty" hidden>
          <strong>No bookings here</strong>
          <span>Bookings made on the <a href="/" target="_blank" rel="noopener">booking portal</a> show up here.</span>
        </div>
      </section>
    </main>

    <aside>
      <section class="card">
        <h2>Alerts and activity</h2>
        <ul id="feed" class="feed"></ul>
        <p id="feed-empty" class="muted" hidden>Nothing yet.</p>
      </section>

      <section class="card" id="phone" hidden>
        <h2>Customer phone <small>simulated</small></h2>
        <div class="device-bar">
          <span class="avatar" id="phone-avatar">?</span>
          <div>
            <strong id="phone-name">Customer phone</strong>
            <small id="phone-number">Open a booking's phone</small>
          </div>
        </div>
        <div id="thread" class="thread"></div>
        <div class="quick">
          <button type="button" data-text="C">C</button>
          <button type="button" data-text="R">R</button>
          <button type="button" data-text="STOP">STOP</button>
          <button type="button" data-text="hello">hello</button>
        </div>
        <form id="reply">
          <input name="text" placeholder="Text message" autocomplete="off" required>
          <button type="submit" aria-label="Send">&uarr;</button>
        </form>
      </section>
    </aside>
  </div>

  <script src="/common.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
