<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
<title id="t">Appointment reminders with reply handling</title>
<desc id="d">A booking creates a confirmation text, a scheduled reminder text and a reply from the customer, all delivered through Sent.</desc>
<defs>
  <radialGradient id="sph" cx="32%" cy="28%" r="80%"><stop offset="0" stop-color="#7aa2ff"/><stop offset="0.55" stop-color="#266df0"/><stop offset="1" stop-color="#1a47b5"/></radialGradient>
  <pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#fff" opacity="0.45"/></pattern>
  <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#dedcdc"/></pattern>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #130f0c; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 14.5px; }
    .sub { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; fill: #6b6560; }
    .card { fill: #fff; stroke: #dedcdc; }
    .card.on { stroke: #266df0; }
    .pill { fill: #fff; stroke: #dedcdc; }
    .wire { fill: none; stroke: #dedcdc; stroke-width: 1.6; }
    .flow { fill: none; stroke: #266df0; stroke-width: 1.8; stroke-linecap: round; stroke-dasharray: 5 7; animation: dash 1.1s linear infinite; }
    .flow.slow { animation-duration: 1.8s; }
    .glyph { fill: none; stroke: #130f0c; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
</defs>
<rect width="1280" height="400" fill="#fdfcfc"/>
<line x1="48" y1="0" x2="48" y2="400" stroke="#f0efef"/><line x1="1232" y1="0" x2="1232" y2="400" stroke="#f0efef"/><line x1="0" y1="40" x2="1280" y2="40" stroke="#f0efef"/><line x1="0" y1="360" x2="1280" y2="360" stroke="#f0efef"/><path d="M43 40h10M48 35v10" stroke="#dedcdc" stroke-width="1"/><path d="M43 360h10M48 355v10" stroke="#dedcdc" stroke-width="1"/><path d="M1227 40h10M1232 35v10" stroke="#dedcdc" stroke-width="1"/><path d="M1227 360h10M1232 355v10" stroke="#dedcdc" stroke-width="1"/><rect x="49" y="41" width="1182" height="318" fill="url(#grid)" opacity="0.55"/><rect x="96" y="104" width="176" height="24" rx="12" fill="#fff" stroke="#dedcdc"/><text class="mono" x="184" y="120" text-anchor="middle" style="letter-spacing:1.5px;font-size:10.5px">BUILT ON THE SENT API</text><text x="96" y="186" style="font-size:46px;font-weight:400;letter-spacing:-1.4px">Appointment reminders</text><text x="96" y="240" style="font-size:46px;font-weight:400;letter-spacing:-1.4px;fill:#6b6560">with reply handling</text><text x="96" y="288" style="font-size:16px;fill:#6b6560">Customers book online and get a confirmation and a reminder by text.</text><text x="96" y="312" style="font-size:16px;fill:#6b6560">They reply C to confirm or R to ask for a new time.</text><g transform="translate(548 96) scale(0.72)">
<g class="diagram">
  <path class="wire" d="M86 145H118"/><path class="wire" d="M238 145C282 145 282 47 320 47"/><path class="wire" d="M238 145H320"/><path class="wire" d="M238 145C282 145 282 243 320 243"/>
  <path class="wire" d="M590 47C620 47 620 145 646 145"/><path class="wire" d="M590 145H646"/><path class="wire" d="M590 243C620 243 620 145 646 145"/><path class="wire" d="M726 145H784"/>
  <path class="flow" d="M86 145H118"/><path class="flow" d="M238 145C282 145 282 47 320 47"/><path class="flow slow" d="M238 145H320"/><path class="flow slow" d="M238 145C282 145 282 243 320 243"/>
  <path class="flow" d="M590 47C620 47 620 145 646 145"/><path class="flow slow" d="M590 145H646"/><path class="flow slow" d="M590 243C620 243 620 145 646 145"/><path class="flow" d="M726 145H784"/>
  <rect class="card on" x="10" y="107" width="76" height="76" rx="14"/>
  <rect class="glyph" x="34" y="131" width="28" height="26" rx="4"/><path class="glyph" d="M34 139H62M42 148l4 4 8-8"/>
  <rect class="pill" x="118" y="132" width="120" height="26" rx="13"/><text class="mono" x="178" y="149" text-anchor="middle">booking.created</text>
  <rect class="card on" x="320" y="15" width="270" height="64" rx="12"/><rect class="card" x="320" y="113" width="270" height="64" rx="12"/><rect class="card" x="320" y="211" width="270" height="64" rx="12"/>
  <rect class="pill" x="332" y="27" width="40" height="40" rx="9"/><rect class="glyph" x="342" y="39" width="20" height="14" rx="4"/><path class="glyph" d="M347 53l-2 5 7-5"/>
  <text class="label" x="388" y="44">Confirmation text</text><text class="sub" x="388" y="60">Sent as soon as you book</text>
  <rect class="pill" x="332" y="125" width="40" height="40" rx="9"/><circle class="glyph" cx="352" cy="145" r="9"/><path class="glyph" d="M352 139v6l4 3"/>
  <text class="label" x="388" y="142">Reminder text</text><text class="sub" x="388" y="158">Sent at the time you choose</text>
  <rect class="pill" x="332" y="223" width="40" height="40" rx="9"/><path class="glyph" d="M360 238h-6a6 6 0 0 0 0 12h6M357 234l-4 4 4 4"/>
  <text class="label" x="388" y="240">Your reply</text><text class="sub" x="388" y="256">Reply C or R to answer</text>
  <rect class="pill" x="646" y="132" width="80" height="26" rx="13"/><text class="mono" x="686" y="149" text-anchor="middle">Deliver</text>
  <circle cx="814" cy="145" r="30" fill="url(#sph)"/><circle cx="814" cy="145" r="30" fill="url(#dots)"/>
  <rect class="pill" x="789" y="185" width="50" height="24" rx="12"/><text class="mono" x="814" y="201" text-anchor="middle">You</text>
</g></g></svg>